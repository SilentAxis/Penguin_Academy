name: Lesson play-through
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  playthrough:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/playthrough.cjs
